<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Inserimento Numero Lotteria</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
      padding: 20px;
    }
    input[type=number], input[type=text] {
      width: 100%;
      padding: 20px;
      font-size: 40pt;
      margin: 8px 0;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 20px;
      font-size: 30pt;
      margin: 8px 0;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button.delete {
      background-color: #e74c3c;
    }
    .container {
      background-color: #f2f2f2;
      border-radius: 10px;
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }
    #current-number {
      font-size: 60px;
      font-weight: bold;
      margin-bottom: 20px;
      text-align: center;
    }
    #previous-numbers {
      font-size: 20px;
      color: #555;
      text-align: center;
      margin-bottom: 30px;
    }
    span.digit {
      padding: 10px;
      margin: 5px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      font-size: 40px;
      display: inline-block;
    }
  </style>
</head>
<body>

<div class="container">

  <div id="status-line" style="text-align:center;font-weight:bold;font-size:20px;margin-bottom:10px"></div>
  <div id="current-number">Caricamento...</div>
  <div id="previous-numbers">...</div>

  <label for="input-number">Inserisci Numero v2:</label>

  <!-- Tastierino numerico iPhone con inputmode -->
  <input
    type="text"
    id="input-number"
    inputmode="numeric"
    pattern="[0-9]*"
    autocomplete="off"
    autofocus
  >

  <button onclick="updateNumber(event)">Aggiorna Numero</button>
  <button class="delete" onclick="deleteNumber(event)">Elimina Numero</button>

</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDy0jxa0lck01b9aPHO9ra-CFGHZjDl3ow",
    authDomain: "lotteria-bd6c9.firebaseapp.com",
    databaseURL: "https://lotteria-bd6c9-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "lotteria-bd6c9",
    storageBucket: "lotteria-bd6c9.firebasestorage.app",
    messagingSenderId: "606098477771",
    appId: "1:606098477771:web:2c445353d3876c12c8014e",
    measurementId: "G-VNYMKWRNTN"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();


  // ---- Modello lotteria condiviso: status + elenco completo dei numeri ----
  // status: 'not_started' | 'live' | 'ended'; drawn: tutti i numeri in ordine di chiamata.
  // current/previous restano scritti per compatibilità con lo schermo numeri.
  function normLottery(d){
    d = d || {};
    let drawn = null;
    if (Array.isArray(d.drawn)) drawn = d.drawn.slice();
    else if (d.drawn && typeof d.drawn === 'object') drawn = Object.values(d.drawn);
    if (!drawn) {
      const prev = Array.isArray(d.previous) ? d.previous.slice().reverse() : [];
      drawn = prev;
      if (d.current && d.current !== '*' && d.current !== '****') drawn.push(d.current);
    }
    drawn = drawn.map(String);
    let status = d.status;
    if (['not_started','live','ended'].indexOf(status) < 0) status = drawn.length ? 'live' : 'not_started';
    return { status: status, drawn: drawn };
  }
  function buildLottery(status, drawn){
    return {
      status: status,
      drawn: drawn,
      current: drawn.length ? drawn[drawn.length - 1] : '*',
      previous: drawn.slice(0, -1).reverse().slice(0, 10)
    };
  }

  const input = document.getElementById('input-number');
  const currentDiv = document.getElementById('current-number');
  const previousDiv = document.getElementById('previous-numbers');
  const statusLine = document.getElementById('status-line');
  const STATUS_TEXT = { not_started: 'Non ancora iniziata', live: 'In corso', ended: 'Terminata' };

  function render(st) {
    const current = st.drawn.length ? st.drawn[st.drawn.length - 1] : '*';
    const prev = st.drawn.slice(0, -1).reverse().slice(0, 10);
    statusLine.textContent = 'Stato lotteria: ' + STATUS_TEXT[st.status] + ' (' + st.drawn.length + ' numeri)';
    currentDiv.textContent = '';
    for (let i = 0; i < current.length; i++) {
      const sp = document.createElement('span');
      sp.className = 'digit';
      sp.textContent = current[i];
      currentDiv.appendChild(sp);
    }
    previousDiv.textContent = prev.length > 0 ? "Precedenti: " + prev.join(" | ") : "";
  }

  db.ref('lottery').on('value', snapshot => render(normLottery(snapshot.val())));

  function mutate(fn) {
    return db.ref('lottery').transaction(cur => {
      const r = fn(normLottery(cur));
      if (!r) return; // annulla
      return buildLottery(r.status, r.drawn);
    });
  }

  function updateNumber(e) {
    e.preventDefault();
    const raw = input.value.trim();
    const n = parseInt(raw, 10);
    if (!/^\d+$/.test(raw) || isNaN(n) || n < 1 || n > 10000) {
      alert("Inserisci un numero valido tra 1 e 10000.");
      return;
    }
    const num = String(n);
    mutate(st => {
      if (st.status === 'ended') return null; // gestito sotto
      return { status: 'live', drawn: st.drawn.concat(num) };
    }).then(res => {
      if (res.committed) return;
      // lotteria terminata: chiedi se riaprirla
      if (confirm('La lotteria risulta terminata. Riaprirla e aggiungere il numero ' + num + '?')) {
        mutate(st => ({ status: 'live', drawn: st.drawn.concat(num) }));
      }
    });
    input.value = "";
    input.focus(); // Riporta il focus per lasciare la tastiera aperta
  }

  function deleteNumber(e) {
    e.preventDefault();
    mutate(st => st.drawn.length ? { status: st.status, drawn: st.drawn.slice(0, -1) } : null);
  }

  // Invio da tastiera (Enter) aggiorna il numero
  input.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      updateNumber(e);
    }
  });
</script>

</body>
</html>
